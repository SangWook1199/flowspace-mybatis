services:
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: flow_space
      MYSQL_USER: flowspace
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql:ro
      # 프로시저 파일들. 컨테이너 안에서 /database 로 보여요.
      - ./backend/database:/database:ro
      # 빈 DB로 처음 켤 때 ddl.sql 다음에 프로시저를 만들어요(파일 이름 순서로 실행돼요).
      - ./backend/database/apply_procedures.sql:/docker-entrypoint-initdb.d/procedures.sql:ro
      # 백엔드 계정(flowspace)은 프로시저 실행 권한만 가져요.
      - ./backend/database/grants.sql:/docker-entrypoint-initdb.d/grants.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flow_space?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: flowspace
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: 3600000
      JWT_REFRESH_TOKEN_EXPIRATION: 1209600000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      FLOWSPACE_AI_ENABLED: "false"
      TZ: Asia/Seoul
    volumes:
      - uploads:/app/uploads

volumes:
  mysql-data:
  uploads:
